					<h2 id="elements">Shopping Bag</h2>
					<div class="row 100%">
						

								<h4>Beat the stereotype of the shopping bag design.</h4>
								<p><span class="image left"><img src="images/shopping_bag.jpg" alt="" /></span>
Perfect for a wide variety of purposes, built from durable materials, classical idea signified with a special complementary gift design. Inject some comfort to the shopping atmosphere to stand a chance to enjoy it.
</p>


								<p><span class="image right
								"><img src="images/pic01.jpg" alt="" /></span>Modern, sleek, and simple designs stand out. Use clean lines, simple colors, and sans serif fonts to achieve a modern look. This packaging took a very modern approach, and made it even more modern by making it gender neutral. It doesn’t lean one way or the other, and draws instant attention from viewers who are curious about who the product is for.</p>
					
								
<!-- Rigid Boxes -->			
					<h2 id="elements">Rigid Boxes</h2>
					<div class="row 100%">
						

								<h4>Customer Design, Be Luxurious</h4>
								<p><span class="image left"><img src="images/hardbox02.jpg"></span>
Boxes provider to category like interlux shipping pack, ties, small leather goods, shoes, belts, cosmetics, tea, wine, perfume and electronic items. Any kind of constructions designed to meet any needs
									
<p><span class="image right"><img src="images/pic02.jpg" alt="" /></span>Gift boxes are some of the most commonly used and sought after boxes within the luxury packaging industry. Rigid Gift boxes differ from other boxes in a few key ways; most notably, material thickness, opening/closing experience, and manufacturing methods. Typically rigid boxes are four to five times thicker than traditional folded cartons and have many more options for opening experiences compared to corrugated boxes.
</p>

<!-- Folding Paper Boxes -->
					<h2 id="elements">Folding Paper Boxes</h2>
					<div class="row 100%">
						

								<h4>As Simple As Possible</h4>
								<p><span class="image left"><img src="images/cardbox.jpg" alt="" /></span>
Sometimes simplicity is key, and that holds true in this packaging. The earth toned, recycled material gives off an earthy feel, which is solidified with the feather illustration. The bright pops of color on the labels lend to the design nicely, bringing a bit more of a modern twist to the package. 
</p>

<p><span class="image right"><img src="images/cardbox01.jpg" alt="" /></span>Folding Paper boxes include two general classifications: folding paperboard boxes and set up paperboard boxes. The folding paperboard box is made of glued paperboard and is shipped to the user as a flat structure to be folded by end user into an erect box. The box is then easily filled; by hand or, by machine.
	
<br><br>

 paper boxes are typically one of three basic structure types, tuck end on both top and bottom, tuck top with tray bottom, or four corner glued lid with tray. There are many variations on these themes.

</p>						
						
</div>

					<h2 id="elements">Plastic Boxes</h2>
					<div class="row 100%">
						

								<h4>Imaging Product Better</h4>
								<p><span class="image left"><img src="images/Plastic_Box.jpg" alt="" /></span>
Plastic box packaging has soft creasing and nice square corners. As a result, it’s easy to be an automated assembly.

In addition, all clear plastic sheets can be offset printing, silk screen printing, and foil stamping and debossing.

<br><br>
									
It’s an outstanding way to catch your consumer’s eyes. And many clear gift boxes, clear candy boxes are such plastic boxes to highlight your products.
						
<br><br>
						
Moreover, clear plastic box packaging is widely used in so many industries including cosmetic, food, health and beauty, wines and others.

</p>						
						
</div>
